name = "psihoterapeut-forms"
main = "index.js"
compatibility_date = "2026-08-11"

# Secrets (never here — set with `npx wrangler secret put <NAME>`):
#   TURNSTILE_SECRET_KEY, BREVO_API_KEY

[vars]
ALLOWED_ORIGINS = "https://dariusweb.github.io"
BREVO_LIST_ID = ""
BREVO_OPTIN_TEMPLATE_ID = ""
BREVO_OPTIN_REDIRECT_URL = "https://dariusweb.github.io/Psihoterapeut/"
CONTACT_TO_EMAIL = ""
CONTACT_FROM_EMAIL = ""

# 5 submissions per minute per IP — generous for a human, useless for a flood.
[[ratelimits]]
name = "SUBMIT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
