name = "psihoterapeut-forms"
main = "index.js"
compatibility_date = "2026-08-11"

# Secrets (never here — set with `npx wrangler secret put <NAME>`):
#   TURNSTILE_SECRET_KEY, BREVO_API_KEY, FIREBASE_SERVICE_ACCOUNT, GOOGLE_CALENDAR_SERVICE_ACCOUNT,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, DOWNLOAD_SIGNING_KEY
#
# DOWNLOAD_SIGNING_KEY signs the download links. Generate one with:
#   node -e "console.log(crypto.randomUUID() + crypto.randomUUID())"
# Rotating it invalidates every link already emailed to a buyer.

[vars]
# localhost is included so the dashboard and forms work in `npm run dev`. A page can only
# send that Origin if it is genuinely served from localhost, and CORS is not what protects
# these routes anyway — Turnstile guards the forms, a Google token and uid allowlist the rest.
ALLOWED_ORIGINS = "https://dariusweb.github.io,http://localhost:5173"
BREVO_LIST_ID = "5"
BREVO_OPTIN_TEMPLATE_ID = "1"
BREVO_OPTIN_REDIRECT_URL = "https://dariusweb.github.io/Psihoterapeut/"
# ponytail: temporary test address — replace with a domain sender before launch, or replies land in spam.
CONTACT_TO_EMAIL = "maury_4u@yahoo.com"
CONTACT_FROM_EMAIL = "maury_4u@yahoo.com"

# Where Stripe sends the buyer back. Joined onto the request's own origin, so a checkout started
# from localhost returns to localhost instead of bouncing the test to production.
RESOURCE_RETURN_PATH = "/Psihoterapeut/resurse"

# Booking. One dedicated calendar (e.g. "Disponibil"), shared with the service account's
# client_email at "Make changes to events". No other calendar is read, so nothing personal is
# exposed. Every timed event created in it from the Google Calendar app opens that window on
# the site, repeats included; all-day entries are ignored, since a bare date says nothing about
# which hours are open. Bookings are written back here and subtract from the window they sit in.
#
# Keep this calendar for availability only: an event added by hand is read as an open window,
# so a personal note parked here would be offered to visitors as bookable time.
BOOKING_CALENDAR_ID = "d71666e5e1eb22f61254411d2f1aac9c535c2548679dc5cd67f70af0af2cb25d@group.calendar.google.com"
BOOKING_TIMEZONE = "Europe/Bucharest"
# A 50-minute session on an hourly grid leaves the 10 minutes between clients. The grid starts
# at each availability window's own start, so a 10:00 window offers 10:00, 11:00, 12:00…
BOOKING_SLOT_MINUTES = "50"
BOOKING_STEP_MINUTES = "60"
BOOKING_LEAD_HOURS = "24"
BOOKING_DAYS_AHEAD = "21"

# Dashboard access. Neither is a secret: the project id is public, and a uid grants nothing
# without a Google-signed token proving you are that user.
FIREBASE_PROJECT_ID = "psihoterapeut"
# Comma-separated Firebase uids allowed into the dashboard. Empty means nobody gets in.
ADMIN_UIDS = "aZ1J95snTTex2WwkMUU3Z7qUm2A3"

# 5 submissions per minute per IP — generous for a human, useless for a flood.
# ponytail: the edge counter is per-PoP and eventually consistent, so the effective limit
# varies either side of 5. Fine as a flood brake; not a precise quota.
[[ratelimits]]
name = "SUBMIT_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Holds the one live-announcement key. Create the namespace with:
#   npx wrangler kv namespace create LIVE --config worker/wrangler.toml
# then uncomment the three lines below and paste the id it prints.
# Kept commented rather than left as id = "", which fails config validation and blocks
# the very command that produces the id.
[[kv_namespaces]]
binding = "LIVE"
id = "46c20d35a93746aaa9c4f67ef2275ddf"

# Paid guides. KV rather than R2, which cannot be enabled without billing details on the
# account; a guide has to fit in a 25 MiB value, which every PDF does. Upload each file with:
#   npx wrangler kv key put loss.pdf --path ./loss.pdf --binding RESOURCE_FILES --remote --config worker/wrangler.toml
# Key names are set in worker/lib/catalogue.js, which is also the only place a price lives.
[[kv_namespaces]]
binding = "RESOURCE_FILES"
id = "183e5f0b1897470da8183d51b3ef0f97"
