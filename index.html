<!DOCTYPE html>
<html lang="ro">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="/favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f8f5ef" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#1b1c17" media="(prefers-color-scheme: dark)">

	<!-- The app ships as an empty shell, so crawlers that don't run JS see only this; the router rewrites it per route. -->
	<title>Psihoterapeut București și online | __SITE_NAME__</title>
	<meta name="description"
		content="Psihoterapie pentru femei care trec prin infertilitate, maternitate sau epuizare profesională. Ședințe în cabinet, în București, sau online.">
	<link rel="canonical" href="__SITE_URL__/">

	<meta property="og:type" content="website">
	<meta property="og:site_name" content="__SITE_NAME__">
	<meta property="og:locale" content="ro_RO">
	<meta property="og:title" content="Psihoterapeut București și online | __SITE_NAME__">
	<meta property="og:description"
		content="Psihoterapie pentru femei care trec prin infertilitate, maternitate sau epuizare profesională. Ședințe în cabinet, în București, sau online.">
	<meta property="og:url" content="__SITE_URL__/">
	<meta name="twitter:card" content="summary">

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@graph": [
			{
				"@type": "Person",
				"@id": "__SITE_URL__/#person",
				"name": "__SITE_NAME__",
				"jobTitle": "Psihoterapeut",
				"url": "__SITE_URL__/",
				"image": "__SITE_URL__/logo.svg",
				"knowsLanguage": ["ro", "en"],
				"knowsAbout": [
					"psihoterapie infertilitate",
					"suport psihologic infertilitate",
					"depresie postpartum",
					"anxietate postpartum",
					"burnout",
					"epuizare profesională",
					"reglare emoțională"
				]
			},
			{
				"@type": "Psychologist",
				"@id": "__SITE_URL__/#practice",
				"name": "__SITE_NAME__ — cabinet de psihoterapie",
				"url": "__SITE_URL__/",
				"logo": "__SITE_URL__/logo.svg",
				"image": "__SITE_URL__/logo.svg",
				"founder": { "@id": "__SITE_URL__/#person" },
				"areaServed": [
					{ "@type": "City", "name": "București" },
					{ "@type": "Country", "name": "România" }
				],
				"availableLanguage": ["ro", "en"],
				"knowsAbout": ["infertilitate", "maternitate", "carieră", "burnout"]
			},
			{
				"@type": "WebSite",
				"@id": "__SITE_URL__/#website",
				"url": "__SITE_URL__/",
				"name": "__SITE_NAME__",
				"inLanguage": "ro",
				"publisher": { "@id": "__SITE_URL__/#person" }
			}
		]
	}
	</script>

	<style>
		/* Paints the canvas before the CSS bundle loads — otherwise the browser shows white full-viewport. */
		:root {
			color-scheme: light;
			background: #f8f5ef;
		}

		:root.dark {
			color-scheme: dark;
			background: #1b1c17;
		}
	</style>

	<script> {
			const mode = localStorage.getItem('theme-preference') ?? 'system'
			const isDark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
			document.documentElement.classList.toggle('dark', isDark)
		} </script>
</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
