name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      # Repository variables, not secrets — both are public values baked into the bundle.
      - name: Build
        run: npm run build
        env:
          VITE_BREVO_FORM_URL: ${{ vars.VITE_BREVO_FORM_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_PROTECT_CONTENT: ${{ vars.VITE_PROTECT_CONTENT || 'true' }}
          VITE_PROTECT_DEVTOOLS: ${{ vars.VITE_PROTECT_DEVTOOLS || 'true' }}
          VITE_OBFUSCATE: ${{ vars.VITE_OBFUSCATE || 'true' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4