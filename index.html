<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="/favicon.ico">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Andreea Georgiana Butacu</title>

	<!-- Both required by dark mode and by the CSS bundle, which is loaded asynchronously. The browser will show a white full-viewport until the CSS bundle loads, so we paint the canvas with a background color first. -->
	<style>
		/* Paints the canvas before the CSS bundle loads — otherwise the browser shows white full-viewport. */
		:root {
			color-scheme: light;
			background: #f9f7f7;
		}

		:root.dark {
			color-scheme: dark;
			background: #1c2118;
		}
	</style>

	<script> {
			const mode = localStorage.getItem('theme-preference') ?? 'system'
			const isDark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
			document.documentElement.classList.toggle('dark', isDark)
		} </script>
</head>

<body>
	<div id="app"></div>
	<script type="module" src="/src/main.js"></script>
</body>

</html>
